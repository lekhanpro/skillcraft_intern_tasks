<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stopwatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&family=Roboto+Flex:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>

  <main class="app">
    <!-- Header -->
    <header class="app__header">
      <div class="app__icon">⏱</div>
      <h1 class="app__title">Stopwatch</h1>
    </header>

    <!-- Time display -->
    <div class="time-glass">
      <div class="time-glass__ring" id="progressRing">
        <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="100"/>
          <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="100"/>
        </svg>
      </div>
      <div class="time-glass__inner">
        <div class="time-display">
          <span class="time-hm" id="timeHM">00:00</span><span class="time-sep">:</span><span class="time-s" id="timeS">00</span><span class="time-ms" id="timeMS">.00</span>
        </div>
        <div class="time-status" id="timeStatus">Ready</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="fab fab--small" id="lapBtn" disabled aria-label="Lap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      </button>
      <button class="fab fab--large fab--primary" id="startBtn" aria-label="Start">
        <svg class="fab-icon fab-icon--play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg class="fab-icon fab-icon--pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="fab fab--small" id="resetBtn" disabled aria-label="Reset">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
      </button>
    </div>

    <!-- Laps -->
    <section class="laps-section" id="lapsSection">
      <div class="laps-header">
        <span class="laps-title">Lap History</span>
        <span class="laps-chip" id="lapChip" hidden>0 laps</span>
      </div>
      <div class="laps-list" id="lapsList"></div>
      <p class="laps-empty" id="lapsEmpty">Start the stopwatch and tap the flag to record laps.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
