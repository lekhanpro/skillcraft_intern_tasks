<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>

  <main class="app">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">Tic Tac Toe</h1>
    </header>

    <!-- Mode toggle -->
    <div class="mode-toggle glass" role="group" aria-label="Game mode">
      <button class="mode-btn mode-btn--active" id="modeAI" data-mode="ai">
        <span class="mode-btn__icon">🤖</span>
        vs Computer
      </button>
      <button class="mode-btn" id="mode2P" data-mode="2p">
        <span class="mode-btn__icon">👥</span>
        2 Players
      </button>
    </div>

    <!-- Score bar -->
    <div class="score-bar glass">
      <div class="score-player score-player--x" id="p1card">
        <div class="score-player__symbol">✕</div>
        <div class="score-player__label" id="p1label">Player 1</div>
        <div class="score-player__num" id="scoreX">0</div>
      </div>
      <div class="score-center">
        <div class="score-draws" id="scoreDraws">0</div>
        <div class="score-draws-label">Draws</div>
      </div>
      <div class="score-player score-player--o" id="p2card">
        <div class="score-player__symbol">○</div>
        <div class="score-player__label" id="p2label">Computer</div>
        <div class="score-player__num" id="scoreO">0</div>
      </div>
    </div>

    <!-- Status -->
    <div class="status-pill glass" id="statusPill">
      <span id="statusText">Player 1's turn</span>
    </div>

    <!-- Board -->
    <div class="board glass" id="board" aria-label="Game board"></div>

    <!-- Actions -->
    <div class="actions">
      <button class="action-btn action-btn--ghost" id="resetScoreBtn">Reset Scores</button>
      <button class="action-btn action-btn--primary" id="newGameBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        New Game
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
