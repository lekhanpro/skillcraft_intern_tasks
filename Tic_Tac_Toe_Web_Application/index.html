<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <span class="nav__brand">Tic Tac Toe</span>
  </nav>

  <main class="main">
    <!-- Mode toggle -->
    <div class="mode-toggle">
      <button class="mode-btn mode-btn--active" id="modeComputer" data-mode="computer">vs Computer</button>
      <button class="mode-btn" id="modeHuman" data-mode="human">2 Players</button>
    </div>

    <!-- Score card -->
    <div class="score-card">
      <div class="player-col player-col--x" id="p1col">
        <div class="player-label">PLAYER 1</div>
        <div class="player-symbol x-symbol">✕</div>
        <div class="player-score" id="scoreX">0</div>
      </div>
      <div class="vs-col">
        <div class="vs-text">VS</div>
        <div class="turn-indicator" id="turnIndicator">
          It's <span class="turn-mark x-mark">✕</span> turn
        </div>
      </div>
      <div class="player-col player-col--o" id="p2col">
        <div class="player-label" id="p2label">COMPUTER</div>
        <div class="player-symbol o-symbol">○</div>
        <div class="player-score" id="scoreO">0</div>
      </div>
    </div>

    <!-- Board -->
    <div class="board" id="board" aria-label="Tic Tac Toe board"></div>

    <!-- Restart -->
    <button class="restart-btn" id="newGame">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
      Restart Game
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
