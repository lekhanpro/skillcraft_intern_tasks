<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="app-header glass">
      <div class="app-header__left">
        <h1 class="app-header__greeting" id="greeting">Good Morning</h1>
        <p class="app-header__sub" id="subtext">You have 0 tasks today</p>
      </div>
      <div class="app-header__icon">✅</div>
    </header>

    <!-- Filter chips -->
    <div class="filter-row" role="tablist" aria-label="Filter tasks">
      <button class="chip chip--active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="chip" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="chip" data-filter="completed" role="tab" aria-selected="false">Done</button>
    </div>

    <!-- Task list -->
    <div class="task-list" id="taskList"></div>
    <p class="empty-state" id="emptyState">No tasks here. Add one below!</p>

    <!-- FAB add button -->
    <button class="add-fab" id="addFab" aria-label="Add task">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Add Task</span>
    </button>
  </div>

  <!-- Add / Edit bottom sheet -->
  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="bottom-sheet glass" id="bottomSheet" aria-modal="true" role="dialog" aria-label="Add task">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="sheetTitle">New Task</h2>
    <div class="sheet-body">
      <div class="field">
        <label class="field__label" for="taskInput">Task name</label>
        <input class="field__input" type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
      </div>
      <div class="field">
        <label class="field__label" for="taskNote">Note (optional)</label>
        <input class="field__input" type="text" id="taskNote" placeholder="Add a note...">
      </div>
      <div class="field">
        <label class="field__label">Priority</label>
        <div class="priority-row">
          <button class="priority-btn" data-p="low">Low</button>
          <button class="priority-btn priority-btn--active" data-p="medium">Medium</button>
          <button class="priority-btn" data-p="high">High</button>
        </div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn sheet-btn--cancel" id="cancelBtn">Cancel</button>
      <button class="sheet-btn sheet-btn--save" id="saveBtn">Add Task</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
